    label: The Bloom Frame
    type: object
    fields:
    - name: vlak
      label: Vlakke inlijsting
      type: object
      fields:
      - name: naam
        label: Formaat
        type: string
      - name: prijs
        label: Prijs (€)
        type: number
      list: true
    - name: shadowbox
      label: Shadowbox
      type: object
      fields:
      - name: naam
        label: Formaat
        type: string
      - name: prijs
        label: Prijs (€)
        type: number
      list: true
    - name: glas_extra
      label: Dubbelzijdig glas (+€)
      type: number
