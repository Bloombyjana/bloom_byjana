frame:
- vraag: Wanneer breng ik mijn boeket binnen?
  antwoord: Lever je boeket binnen 1 à 2 dagen na de trouw af. Hoe verser, hoe mooier het resultaat. Bespreek ook op voorhand met je bloemist dat je de bloemen graag zou laten persen.
- vraag: Hoelang duurt het volledige proces?
  antwoord: Reken op 10 à 12 weken van begin tot einde. Het drogen alleen duurt al 6 à 8 weken, daarna volgt de verwerking en afwerking van het frame.
- vraag: Kunnen alle bloemen ingelijst worden?
  antwoord: De meeste bloemen lenen zich perfect voor het persen en inlijsten. Twijfel je? Stuur een foto en je weet snel wat mogelijk is.
- vraag: Wanneer betaal ik?
  antwoord: Bij reservatie van jouw datum wordt een voorschot van €150 gevraagd. Het resterende bedrag betaal je bij het afhalen van je afgewerkt frame. Wens je een factuur? Geef dit dan op voorhand door.
- vraag: Wat is het verschil tussen een vlakke inlijsting en een shadowbox?
  antwoord: 'Bij een vlakke inlijsting worden de geperste bloemen plat verwerkt: strak en modern. Een shadowbox heeft meer diepte en geeft de bloemen ruimte, waardoor het driedimensionaal oogt.'
- vraag: Kan ik mijn geloften of trouwuitnodiging mee laten verwerken?
  antwoord: Ja! Kies dan voor een A3-formaat (vlak of shadowbox) met geloften, uitnodiging of foto (+€20). Breng deze documenten mee wanneer je je boeket binnenbrengt.
- vraag: Kan ik mijn bloemen opsturen als ik te ver woon?
  antwoord: Ja, dat kan. Stuur je bloemen plat in een stevige doos, goed opgevuld met verfrommeld krantenpapier, bij voorkeur met Track & Trace. Neem voor het opsturen even contact op, zodat we samen een datum afspreken.
