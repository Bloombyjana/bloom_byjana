frame:
- titel: Reserveer je datum
  tekst: Zeker zijn van je plaatsje? Reserveer jouw trouwdatum online.
- titel: Breng je boeket
  tekst: Lever je verse boeket binnen 1 à 2 dagen na de trouw af.
- titel: Drogen & ontwerp
  tekst: We drogen je bloemen (6–8 weken) en bespreken samen het ontwerp.
- titel: Afhalen
  tekst: Na ±10–12 weken is jouw frame klaar om mee naar huis te nemen.
frame_stijl:
- titel: Formaten
  tekst: Vlak in A5, A4, A3 of A2. Shadowbox in 21×21, A4, A3 of 30×30.
- titel: Materialen
  tekst: Hout in licht eik of donker kers. Aluminium in wit, mat zwart of mat goud.
- titel: Afwerkingen
  tekst: Vlakke inlijsting of shadowbox, desgewenst met dubbelzijdig glas.
bar:
- titel: Kiezen
  tekst: Gasten kiezen hun favoriete bloemen.
- titel: Samenstellen
  tekst: Ze maken zelf een klein boeketje.
- titel: Meenemen
  tekst: Een fleurige herinnering om mee naar huis te nemen.
florals:
- titel: Kennismaking
  tekst: We leren elkaar kennen.
- titel: Inspiratie
  tekst: Wensen, bloemen en kleuren.
- titel: Voorstel
  tekst: Een persoonlijk bloemenconcept.
- titel: Uitvoering
  tekst: Jullie dag in bloei.
